[package]
name = "ros-humble-rmw-zenoh-cpp"
version = "0.1.2"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

# satisfies the recipe's "ros-humble-zenoh-cpp-vendor 0.1.2.*" host/run
# requirement from the workspace source package instead of the py311 binary
[package.host-dependencies]
ros-humble-zenoh-cpp-vendor = { path = "../ros-humble-zenoh-cpp-vendor" }

[package.run-dependencies]
ros-humble-zenoh-cpp-vendor = { path = "../ros-humble-zenoh-cpp-vendor" }
