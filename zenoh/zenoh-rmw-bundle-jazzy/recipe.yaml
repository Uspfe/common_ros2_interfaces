# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Merged multi-output recipe for a mutex-0.14 rebuild of rmw_zenoh_cpp 0.2.10
# (see ../README.md). Same bundling trick as the humble bundle: the rmw output
# depends on the vendor output via pin_subpackage, resolved inside
# rattler-build rather than as a separate pixi source dependency, so it works
# identically whether the bundle is consumed via `path` or `git`.
#
# WHY THIS EXISTS
# robostack-jazzy's stock `ros-jazzy-rmw-zenoh-cpp 0.2.10` is built against
# `ros2-distro-mutex 0.16`, and that robostack generation builds its ROS
# packages against Eigen 5. OKVIS2-X's vendored opengv only supports Eigen 3.4
# (its FindEigen.cmake cannot even parse Eigen 5's version macros), and Eigen
# 3.4 is only installable in the mutex-0.14 generation. So an environment that
# builds OKVIS cannot also install stock rmw_zenoh 0.2.10.
#
# `libzenohc`/`libzenohcxx` are plain conda-forge packages, independent of the
# ROS generation -- so rebuilding 0.2.10 against mutex 0.14 while keeping
# libzenohc at 1.9.0 yields an RMW that speaks the same zenoh wire protocol as
# the stock 0.2.10 the rest of the fleet runs, but installs next to Eigen 3.4.
#
# CHANGES VS. THE OFFICIAL RECIPES
# The two recipes are the official ones, extracted from `info/recipe/` of
# ros-jazzy-{rmw-zenoh-cpp,zenoh-cpp-vendor}-0.2.10-np2py312h6b96cb9_21.conda,
# with only these differences:
#   - merged into one multi-output recipe
#   - `ros2-distro-mutex 0.16.* jazzy_*` -> `0.14.* jazzy_*` (host + run, both outputs)
#   - the rmw output's `ros-jazzy-zenoh-cpp-vendor` host/run requirement replaced
#     with `${{ pin_subpackage(..., exact=True) }}`
#   - build number 21 -> 1021, so it never collides with an official rebuild
# Sources stay on the official release tags, so this is the same code.

recipe:
  name: ros-jazzy-rmw-zenoh-cpp-bundle
  version: 0.2.10

outputs:
  - package:
      name: ros-jazzy-zenoh-cpp-vendor
      version: 0.2.10
    source:
      git: https://github.com/ros2-gbp/rmw_zenoh-release.git
      tag: release/jazzy/zenoh_cpp_vendor/0.2.10-1
      target_directory: ros-jazzy-zenoh-cpp-vendor/src/work
    build:
      script: ${{ '$RECIPE_DIR/build_vendor.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
      number: 1021
      post_process:
        - files:
            - '*.pc'
          regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
          replacement: $$(CONDA_BUILD_SYSROOT_S)
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/sysroot)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
    about:
      license: Apache-2.0
      summary: Vendor pkg to install zenoh-cpp
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - if: target_platform!='emscripten-wasm32'
          then:
            - ${{ stdlib('c') }}
        - ninja
        - python
        - setuptools
        - git
        - git-lfs
        - if: unix
          then:
            - patch
            - make
            - coreutils
        - if: win
          then:
            - m2-patch
        - if: osx
          then:
            - tapi
        - if: build_platform != target_platform
          then:
            - pkg-config
        - cmake
        - cython
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
        - if: build_platform != target_platform
          then:
            - git
      host:
        - if: build_platform == target_platform
          then:
            - pkg-config
        - libzenohc
        - libzenohcxx
        - numpy
        - pip
        - python
        - ros-jazzy-ament-cmake
        - ros-jazzy-ament-cmake-vendor-package
        - ros-jazzy-ros-environment
        - ros-jazzy-ros-workspace
        - ros2-distro-mutex 0.14.* jazzy_*
        - rust
        - if: build_platform == target_platform
          then:
            - git
      run:
        - python
        - ros-jazzy-ros-workspace
        - ros2-distro-mutex 0.14.* jazzy_*
        - if: osx and x86_64
          then:
            - __osx >=${{ MACOSX_DEPLOYMENT_TARGET|default('10.14') }}

  - package:
      name: ros-jazzy-rmw-zenoh-cpp
      version: 0.2.10
    source:
      git: https://github.com/ros2-gbp/rmw_zenoh-release.git
      tag: release/jazzy/rmw_zenoh_cpp/0.2.10-1
      target_directory: ros-jazzy-rmw-zenoh-cpp/src/work
    build:
      script: ${{ '$RECIPE_DIR/build_rmw.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
      number: 1021
      post_process:
        - files:
            - '*.pc'
          regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
          replacement: $$(CONDA_BUILD_SYSROOT_S)
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/sysroot)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
    about:
      license: Apache-2.0 OR BSD-3-Clause
      summary: A ROS 2 middleware implementation using zenoh-cpp
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - if: target_platform!='emscripten-wasm32'
          then:
            - ${{ stdlib('c') }}
        - ninja
        - python
        - setuptools
        - git
        - git-lfs
        - if: unix
          then:
            - patch
            - make
            - coreutils
        - if: win
          then:
            - m2-patch
        - if: osx
          then:
            - tapi
        - if: build_platform != target_platform
          then:
            - pkg-config
        - cmake
        - cython
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
      host:
        - if: build_platform == target_platform
          then:
            - pkg-config
        - libzenohc
        - libzenohcxx
        - numpy
        - pip
        - python
        - ros-jazzy-ament-cmake
        - ros-jazzy-ament-index-cpp
        - ros-jazzy-ament-lint-auto
        - ros-jazzy-ament-lint-common
        - ros-jazzy-fastcdr
        - ros-jazzy-rcpputils
        - ros-jazzy-rcutils
        - ros-jazzy-rmw
        - ros-jazzy-ros-environment
        - ros-jazzy-ros-workspace
        - ros-jazzy-rosidl-typesupport-fastrtps-c
        - ros-jazzy-rosidl-typesupport-fastrtps-cpp
        - ros-jazzy-tracetools
        - ${{ pin_subpackage('ros-jazzy-zenoh-cpp-vendor', exact=True) }}
        - ros2-distro-mutex 0.14.* jazzy_*
      run:
        - python
        - ros-jazzy-ament-index-cpp
        - ros-jazzy-fastcdr
        - ros-jazzy-rcpputils
        - ros-jazzy-rcutils
        - ros-jazzy-rmw
        - ros-jazzy-ros-workspace
        - ros-jazzy-rosidl-typesupport-fastrtps-c
        - ros-jazzy-rosidl-typesupport-fastrtps-cpp
        - ros-jazzy-tracetools
        - ${{ pin_subpackage('ros-jazzy-zenoh-cpp-vendor', exact=True) }}
        - ros2-distro-mutex 0.14.* jazzy_*
        - if: osx and x86_64
          then:
            - __osx >=${{ MACOSX_DEPLOYMENT_TARGET|default('10.14') }}
