# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Merged multi-output recipe for the py312 rebuilds of rmw_zenoh_cpp 0.1.2
# (see recipes/README.md). Bundling both outputs in one recipe lets the
# rmw output depend on the vendor output via pin_subpackage, resolved
# entirely inside rattler-build instead of as a separate pixi source
# dependency (which is what broke git-based nested source deps).

recipe:
  name: ros-humble-rmw-zenoh-cpp-bundle
  version: 0.1.2

outputs:
  - package:
      name: ros-humble-zenoh-cpp-vendor
      version: 0.1.2
    source:
      git: https://github.com/ros2-gbp/rmw_zenoh-release.git
      tag: release/humble/zenoh_cpp_vendor/0.1.2-1
      target_directory: ros-humble-zenoh-cpp-vendor/src/work
      patches:
        - patch/ros-humble-zenoh-cpp-vendor.patch
    build:
      script: ${{ '$RECIPE_DIR/build_vendor.sh' if unix or wasm32 else '%RECIPE_DIR%\\build_vendor.bat' }}
      number: 13
      post_process:
        - files:
            - '*.pc'
          regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
          replacement: $$(CONDA_BUILD_SYSROOT_S)
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/sysroot)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
    about:
      homepage: https://www.ros.org/
      license: BSD-3-Clause
      summary: |
        Robot Operating System
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - if: target_platform!='emscripten-wasm32'
          then:
            - ${{ stdlib('c') }}
        - ninja
        - python
        - setuptools
        - git
        - git-lfs
        - if: unix
          then:
            - patch
            - make
            - coreutils
        - if: win
          then:
            - m2-patch
        - if: osx
          then:
            - tapi
        - if: build_platform != target_platform
          then:
            - pkg-config
        - cmake
        - cython
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
        - if: build_platform != target_platform
          then:
            - git
      host:
        - if: build_platform == target_platform
          then:
            - pkg-config
        - libzenohc
        - libzenohcxx
        - numpy
        - pip
        - python
        - ros-humble-ament-cmake
        - ros-humble-ament-cmake-vendor-package
        - ros-humble-ros-environment
        - ros-humble-ros-workspace
        - ros2-distro-mutex 0.9.* humble_*
        - rust
        - if: build_platform == target_platform
          then:
            - git
      run:
        - python
        - ros-humble-ros-workspace
        - ros2-distro-mutex 0.9.* humble_*
        - if: osx and x86_64
          then:
            - __osx >=${{ MACOSX_DEPLOYMENT_TARGET|default('10.14') }}

  - package:
      name: ros-humble-rmw-zenoh-cpp
      version: 0.1.2
    source:
      git: https://github.com/ros2-gbp/rmw_zenoh-release.git
      tag: release/humble/rmw_zenoh_cpp/0.1.2-1
      target_directory: ros-humble-rmw-zenoh-cpp/src/work
    build:
      script: ${{ '$RECIPE_DIR/build_rmw.sh' if unix or wasm32 else '%RECIPE_DIR%\\build_rmw.bat' }}
      number: 13
      post_process:
        - files:
            - '*.pc'
          regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
          replacement: $$(CONDA_BUILD_SYSROOT_S)
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/sysroot)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
        - files:
            - '*.cmake'
          regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
          replacement: $$ENV{CONDA_BUILD_SYSROOT}
    about:
      homepage: https://www.ros.org/
      license: BSD-3-Clause
      summary: |
        Robot Operating System
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - if: target_platform!='emscripten-wasm32'
          then:
            - ${{ stdlib('c') }}
        - ninja
        - python
        - setuptools
        - git
        - git-lfs
        - if: unix
          then:
            - patch
            - make
            - coreutils
        - if: win
          then:
            - m2-patch
        - if: osx
          then:
            - tapi
        - if: build_platform != target_platform
          then:
            - pkg-config
        - cmake
        - cython
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
      host:
        - if: build_platform == target_platform
          then:
            - pkg-config
        - libzenohc
        - libzenohcxx
        - numpy
        - pip
        - python
        - ros-humble-ament-cmake
        - ros-humble-ament-index-cpp
        - ros-humble-ament-lint-auto
        - ros-humble-ament-lint-common
        - ros-humble-fastcdr
        - ros-humble-rcpputils
        - ros-humble-rcutils
        - ros-humble-rmw
        - ros-humble-ros-environment
        - ros-humble-ros-workspace
        - ros-humble-rosidl-typesupport-fastrtps-c
        - ros-humble-rosidl-typesupport-fastrtps-cpp
        - ros-humble-tracetools
        - ${{ pin_subpackage('ros-humble-zenoh-cpp-vendor', exact=True) }}
        - ros2-distro-mutex 0.9.* humble_*
      run:
        - python
        - ros-humble-ament-index-cpp
        - ros-humble-fastcdr
        - ros-humble-rcpputils
        - ros-humble-rcutils
        - ros-humble-rmw
        - ros-humble-ros-workspace
        - ros-humble-rosidl-typesupport-fastrtps-c
        - ros-humble-rosidl-typesupport-fastrtps-cpp
        - ros-humble-tracetools
        - ${{ pin_subpackage('ros-humble-zenoh-cpp-vendor', exact=True) }}
        - ros2-distro-mutex 0.9.* humble_*
        - if: osx and x86_64
          then:
            - __osx >=${{ MACOSX_DEPLOYMENT_TARGET|default('10.14') }}
