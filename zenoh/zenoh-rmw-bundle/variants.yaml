# Variant config for local py312 rebuilds of rmw_zenoh_cpp / zenoh_cpp_vendor 0.1.2.
# Based on the official robostack-humble 0.1.2 builds (np126py311*_13),
# changed: python 3.11→3.12, numpy 1.26→2. libzenohc/libzenohcxx stay at
# 1.4.0 to keep zenoh wire compatibility with stock 0.1.2 installs.
c_compiler:
  - gcc
c_compiler_version:
  - "13"
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.17"
cxx_compiler:
  - gxx
cxx_compiler_version:
  - "13"
cmake:
  - 3.*
libzenohc:
  - 1.4.0
libzenohcxx:
  - 1.4.0
numpy:
  - "2"
python:
  - 3.12.* *_cpython
